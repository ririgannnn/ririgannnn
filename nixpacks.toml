# Railway Nixpacks Configuration
# Deploy: 荔荔绀工作台 · Ririgannnn (Backend + Frontend)

# 明确指定使用 Node.js 运行时（覆盖静态站点自动检测）
providers = ["nodejs"]

[phases.setup]
nixPkgs = ["nodejs_22"]

[phases.install]
cmds = [
  "npm install",
  "cd server && npm install"
]

[phases.build]
cmds = [
  "rm -rf dist",
  "npm run build",
  "cd server && npm run build"
]

[start]
cmd = "node server/dist/index.js"

[variables]
NODE_ENV = "production"
