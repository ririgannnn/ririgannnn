# Railway Nixpacks Configuration
# Deploy: 荔荔绀工作台 · Ririgannnn (Backend + Frontend)

[phases.setup]
nixPkgs = ["nodejs_22"]

[phases.install]
cmds = [
  "npm install",
  "cd server && npm install"
]

[phases.build]
cmds = [
  "npm run build",
  "cd server && npm run build"
]

[start]
cmd = "node server/dist/index.js"

[variables]
NODE_ENV = "production"
