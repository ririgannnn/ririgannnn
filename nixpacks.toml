# Railway Nixpacks Configuration
# Deploy: 荔荔绀工作台 · Ririgannnn (Backend + Frontend)
# Build is auto-detected from root package.json: "npm run build"

[phases.install]
cmds = [
  "npm install",
  "cd server && npm install --include=dev"
]

[start]
cmd = "node server/dist/index.js"

[variables]
NODE_ENV = "production"
