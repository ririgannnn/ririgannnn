# Railway Nixpacks Configuration
# Deploy: 荔荔绀工作台 · Ririgannnn (Backend + Frontend)
# All server deps merged into root package.json for reliable builds

[phases.install]
cmds = ["npm ci"]

[phases.build]
cmds = ["npm run build"]

[start]
cmd = "node server/dist/index.js"

[variables]
NODE_ENV = "production"
