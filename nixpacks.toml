# Railway Nixpacks Configuration
# Deploy: 荔荔绀工作台 · Ririgannnn (Backend + Frontend)

[phases.install]
cmds = [
  "npm ci",
  "cd server && npm ci"
]

[phases.build]
cmds = [
  "npm run build",
  "cd server && npx tsc"
]

[start]
cmd = "node server/dist/index.js"

[variables]
NODE_ENV = "production"
